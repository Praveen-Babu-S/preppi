syntax = "proto3";

package question.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

option go_package = "preppi.com/proto/question/v1;v1";

enum QuestionStatus {
  QUESTION_STATUS_UNSPECIFIED = 0;
  QUESTION_STATUS_OPEN = 1;
  QUESTION_STATUS_ASSIGNED = 2;
  QUESTION_STATUS_IN_PROGRESS = 3;
  QUESTION_STATUS_ANSWERED = 4;
  QUESTION_STATUS_ESCALATED = 5;
}

enum Urgency {
  URGENCY_UNSPECIFIED = 0;
  URGENCY_LOW = 1;
  URGENCY_NORMAL = 2;
  URGENCY_URGENT = 3;
}

service QuestionService {
  rpc CreateQuestion(CreateQuestionRequest) returns (CreateQuestionResponse);
  rpc GetQuestionById(GetQuestionByIdRequest) returns (GetQuestionByIdResponse);
  rpc ListQuestionsByStudent(ListQuestionsByStudentRequest) returns (ListQuestionsByStudentResponse);
  rpc UpdateQuestionStatus(UpdateQuestionStatusRequest) returns (UpdateQuestionStatusResponse);
  rpc SearchQuestions(SearchQuestionsRequest) returns (SearchQuestionsResponse);
  rpc UpdateQuestion(UpdateQuestionRequest) returns (UpdateQuestionResponse);
}

message CreateQuestionRequest {
  string student_id = 1;
  string subject = 2;
  string topic = 3;
  string description = 4;
  repeated string image_urls = 5;
  Urgency urgency = 6;
}

message CreateQuestionResponse {
  string question_id = 1;
  QuestionStatus status = 2;
  google.protobuf.Timestamp created_at = 3;
}

message GetQuestionByIdRequest {
  string question_id = 1;
}

message GetQuestionByIdResponse {
  Question question = 1;
  SolutionSummary solution = 2;
  repeated CommentSummary comments = 3;
}

message ListQuestionsByStudentRequest {
  string student_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message ListQuestionsByStudentResponse {
  repeated Question questions = 1;
  string next_page_token = 2;
}

message UpdateQuestionStatusRequest {
  string question_id = 1;
  QuestionStatus status = 2;
}

message UpdateQuestionStatusResponse {
  Question question = 1;
}

message SearchQuestionsRequest {
  string query = 1;
  string subject = 2;
  string page_token = 3;
  int32 page_size = 4;
}

message SearchQuestionsResponse {
  repeated Question questions = 1;
  string next_page_token = 2;
}

message UpdateQuestionRequest {
  string question_id = 1;
  google.protobuf.FieldMask update_mask = 2;
  string subject = 3;
  string topic = 4;
  string description = 5;
  Urgency urgency = 6;
}

message UpdateQuestionResponse {
  Question question = 1;
}

message Question {
  string id = 1;
  string student_id = 2;
  string assignee_id = 3;
  string subject = 4;
  string topic = 5;
  string description = 6;
  repeated string image_urls = 7;
  Urgency urgency = 8;
  QuestionStatus status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message SolutionSummary {
  string id = 1;
  string mentor_id = 2;
  string description = 3;
  int32 upvotes = 4;
  bool is_accepted = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CommentSummary {
  string id = 1;
  string user_id = 2;
  string message = 3;
  google.protobuf.Timestamp created_at = 4;
}
