syntax = "proto3";

package solution.v1;

import "google/protobuf/timestamp.proto";

option go_package = "preppi.com/proto/solution/v1;v1";

enum VoteType {
  VOTE_TYPE_UNSPECIFIED = 0;
  VOTE_TYPE_UP = 1;
  VOTE_TYPE_DOWN = 2;
}

service SolutionService {
  rpc CreateSolution(CreateSolutionRequest) returns (CreateSolutionResponse);
  rpc GetSolutionById(GetSolutionByIdRequest) returns (GetSolutionByIdResponse);
  rpc ListSolutionsByQuestion(ListSolutionsByQuestionRequest) returns (ListSolutionsByQuestionResponse);
  rpc VoteSolution(VoteSolutionRequest) returns (VoteSolutionResponse);
  rpc AcceptSolution(AcceptSolutionRequest) returns (AcceptSolutionResponse);
  rpc CreateFollowUp(CreateFollowUpRequest) returns (CreateFollowUpResponse);
  rpc ListFollowUps(ListFollowUpsRequest) returns (ListFollowUpsResponse);
}

message CreateSolutionRequest {
  string question_id = 1;
  string mentor_id = 2;
  string description = 3;
  repeated string image_urls = 4;
}

message CreateSolutionResponse {
  Solution solution = 1;
}

message GetSolutionByIdRequest {
  string solution_id = 1;
}

message GetSolutionByIdResponse {
  Solution solution = 1;
}

message ListSolutionsByQuestionRequest {
  string question_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message ListSolutionsByQuestionResponse {
  repeated Solution solutions = 1;
  string next_page_token = 2;
}

message VoteSolutionRequest {
  string solution_id = 1;
  string user_id = 2;
  VoteType vote = 3;
}

message VoteSolutionResponse {
  int32 upvotes = 1;
  int32 downvotes = 2;
}

message AcceptSolutionRequest {
  string solution_id = 1;
  string student_id = 2;
}

message AcceptSolutionResponse {
  bool accepted = 1;
}

message CreateFollowUpRequest {
  string solution_id = 1;
  string user_id = 2;
  string message = 3;
  repeated string image_urls = 4;
}

message CreateFollowUpResponse {
  FollowUp follow_up = 1;
}

message ListFollowUpsRequest {
  string solution_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message ListFollowUpsResponse {
  repeated FollowUp follow_ups = 1;
  string next_page_token = 2;
}

message Solution {
  string id = 1;
  string question_id = 2;
  string mentor_id = 3;
  string description = 4;
  repeated string image_urls = 5;
  int32 upvotes = 6;
  int32 downvotes = 7;
  bool is_accepted = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message FollowUp {
  string id = 1;
  string solution_id = 2;
  string user_id = 3;
  string message = 4;
  repeated string image_urls = 5;
  google.protobuf.Timestamp created_at = 6;
}
