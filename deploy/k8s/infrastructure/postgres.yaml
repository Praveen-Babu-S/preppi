apiVersion: v1
kind: Secret
metadata:
  name: doubt-postgres-secret
  namespace: doubt-resolver
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "replace-me"
  POSTGRES_DB: doubt_resolver
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: doubt-resolver
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: doubt-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: doubt-resolver
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
