apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: preppi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: preppi/auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          env:
            - name: AUTH_PORT
              value: "50051"
            - name: DATABASE_HOST
              value: "postgres.preppi.svc.cluster.local"
            - name: DATABASE_NAME
              value: "doubt_auth"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: preppi
spec:
  selector:
    app: auth
  ports:
    - port: 50051
      targetPort: 50051
