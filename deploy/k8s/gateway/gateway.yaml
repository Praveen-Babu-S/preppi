apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: preppi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: preppi/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: AUTH_ADDR
              value: "auth.preppi.svc.cluster.local:50051"
            - name: USER_ADDR
              value: "user.preppi.svc.cluster.local:50052"
            - name: QUESTION_ADDR
              value: "question.preppi.svc.cluster.local:50053"
            - name: MATCHING_ADDR
              value: "matching.preppi.svc.cluster.local:50054"
            - name: SOLUTION_ADDR
              value: "solution.preppi.svc.cluster.local:50055"
            - name: CHAT_ADDR
              value: "chat.preppi.svc.cluster.local:50056"
            - name: NOTIFICATION_ADDR
              value: "notification.preppi.svc.cluster.local:50057"
            - name: KNOWLEDGEBASE_ADDR
              value: "knowledgebase.preppi.svc.cluster.local:50058"
            - name: ANALYTICS_ADDR
              value: "analytics.preppi.svc.cluster.local:50059"
            - name: ADMIN_ADDR
              value: "admin.preppi.svc.cluster.local:50060"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: preppi
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
